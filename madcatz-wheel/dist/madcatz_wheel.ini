; =====================================================================
;  MadCatz Wireless Force Feedback Racing Wheel (Xbox 360) -> vJoy
;  Tenere questo file nella stessa cartella di madcatz_wheel.exe
; =====================================================================

[general]
vjoy_device = 1        ; numero del dispositivo vJoy da usare (1-16)
xinput_slot = -1       ; -1 = automatico (primo volante trovato), oppure 0-3
poll_ms     = 2        ; intervallo di lettura in ms
show_status = 1        ; 1 = mostra lo stato in tempo reale nella console

[steering]
axis          = X      ; asse vJoy dello sterzo
invert        = 0
deadzone      = 0      ; zona morta al centro, in %
saturation    = 100    ; % di rotazione per arrivare a fondo scala (es. 80 = sterzo piu' rapido)
linearity     = 1.0    ; 1 = lineare, >1 meno sensibile al centro, <1 piu' sensibile
center_offset = 0      ; correzione del centro in % (-50..50)

[pedals]
mode                  = separate ; separate = gas e freno su assi distinti (consigliato)
                                 ; combined = un solo asse (Y), gas sopra e freno sotto
accelerator_axis      = Y
brake_axis            = Z
accelerator_invert    = 0
brake_invert          = 0
deadzone_low          = 0        ; % ignorata a pedale rilasciato
deadzone_high         = 0        ; % ignorata a pedale premuto a fondo
accelerator_linearity = 1.0
brake_linearity       = 1.0

[extra_axes]
; Assi XInput secondari, normalmente fermi al centro su questo volante.
; Valori: X Y Z RX RY RZ SL0 SL1 NONE
thumb_ly = RX
thumb_rx = RY
thumb_ry = RZ

[buttons]
; Pulsante XInput = numero del pulsante vJoy (0 = disattivato)
A          = 1
B          = 2
X          = 3
Y          = 4
LB         = 5
RB         = 6
BACK       = 7
START      = 8
LS         = 9
RS         = 10
GUIDE      = 11
DPAD_UP    = 12
DPAD_DOWN  = 13
DPAD_LEFT  = 14
DPAD_RIGHT = 15
dpad_as_pov = 1        ; 1 = la croce direzionale e' anche un POV/hat

[ffb]
enabled       = 1
mode          = directional ; directional = motore sx tira a sinistra, motore dx tira a destra
                            ; rumble      = entrambi i motori con l'intensita' della forza
                            ; left/right  = solo un motore
invert        = 0           ; inverte la direzione (usa --ffb-test per capirlo)
gain          = 100         ; forza globale in % (0-300)
min_force     = 0           ; % minima per vincere l'attrito del motore (es. 10-20)
damper_scale  = 0.25        ; sensibilita' effetto damper (smorzamento)
inertia_scale = 0.02        ; sensibilita' effetto inertia
update_ms     = 8           ; intervallo di aggiornamento motori (wireless: 8-16)
